# Publishing Munaxa Control's images to Amazon ECR (shared AWS stack, munaxa-platform infra/aws),
# so a deployment pulls an artifact built and checked here, pinned by digest.
#
#   munaxa-control/api      the `api` target of ./Dockerfile
#   munaxa-control/migrate  the `migrate` target (the release job)
#   munaxa-control/portal   the `portal` target
#
# **Tag-triggered, and the tag names the commit.** A tag `image/<40-hex commit SHA>` on a commit
# that is on `main`. The jobs that touch ECR run in the protected `image-release` environment and
# assume this repository's image publisher role through GitHub OIDC; the role's trust requires that
# environment and an image/* tag, and it may push only to these three repositories. No registry
# credential exists.
#
# **No `latest`.** Two immutable tags per image (`<short>`, `sha-<full>`) and the digest, which is
# what the stack's tfvars name. The workflow is inert until the owner sets the repository variable
# AWS_IMAGE_PUBLISHER_ROLE_ARN (munaxa-platform infra/aws/README.md, gate G2).

name: Publish images

on:
  push:
    tags:
      - 'image/**'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  REGISTRY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  source:
    name: Resolve the source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Read the commit from the tag name
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="${REF_NAME#image/}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag must be image/<40-hex commit SHA>, got '$REF_NAME'"; exit 1
          fi
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "::error::tag $REF_NAME points at $GITHUB_SHA, not at the commit it names"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main (reviewed history)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }

  publish:
    name: munaxa-control/${{ matrix.target }}
    needs: source
    runs-on: ubuntu-latest
    environment: image-release # required reviewer; the publisher role trusts only this subject
    permissions:
      contents: read
      packages: read # @munaxa/* from GitHub Packages, during the build only
      id-token: write # GitHub OIDC, for the image publisher role
    strategy:
      fail-fast: false
      matrix:
        target: [api, migrate, portal]
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
    steps:
      - name: Refuse to run before the publisher role exists
        env:
          ROLE: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_IMAGE_PUBLISHER_ROLE_ARN is not set (munaxa-platform infra/aws, gate G2)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '229251310592'

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: false # a single-platform manifest, so the digest names the image
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/munaxa-control/${{ matrix.target }}:${{ env.SHORT }}
            ${{ env.REGISTRY }}/munaxa-control/${{ matrix.target }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The registry credential for @munaxa/* as a BuildKit secret, never a build argument.
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Record the digest
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### munaxa-control/$TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REGISTRY/munaxa-control/$TARGET@$DIGEST\` from \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
